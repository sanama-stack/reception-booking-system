# Layers the two applications back in as containers, giving the five-container deployment
# topology of docs/02-product-architecture.md §1.
#
#   make up-all
#
# This is the shape phase 11 deploys and the shape CI smoke-tests. Day-to-day development uses
# `make up` instead and runs both applications from the IDE.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-reception}
      DB_USER: ${POSTGRES_USER:-reception}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@reception.local}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MANAGE_LINK_SECRET: ${MANAGE_LINK_SECRET:?MANAGE_LINK_SECRET is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # 9080, not 8080: this is the origin a Manage Link is written with, and 8080 is what
      # Caddy listens on *inside* the network — a port no customer's browser can reach.
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:9080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      BACKEND_INTERNAL_URL: http://backend:8081/api
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  caddy:
    environment:
      BACKEND_UPSTREAM: backend:8081
      FRONTEND_UPSTREAM: frontend:3000
      # Empty, whatever .env says. The frontend here is a production build served by `next start`,
      # which needs no eval — so this topology gets the Content-Security-Policy as deployed, and
      # the header test asserts against this shape rather than against a developer's machine.
      CSP_SCRIPT_EXTRA: ""
      HSTS: ${HSTS:-max-age=0}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
