<p>Hi {{customerName}},</p>
<p>A reminder that your appointment is tomorrow.</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:16px 0;font-size:15px;">
  <tr><td style="padding:2px 16px 2px 0;color:#71717a;">What</td><td>{{serviceName}}</td></tr>
  <tr><td style="padding:2px 16px 2px 0;color:#71717a;">When</td><td><strong>{{when}}</strong></td></tr>
  <tr><td style="padding:2px 16px 2px 0;color:#71717a;">With</td><td>{{employeeName}}</td></tr>
</table>
<p style="margin:16px 0;">
  Your confirmation code is
  <strong style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:17px;letter-spacing:1px;">{{confirmationCode}}</strong>.
</p>
<p style="margin:24px 0;">
  <a href="{{manageUrl}}"
     style="display:inline-block;padding:10px 18px;background:#18181b;color:#ffffff;
            border-radius:6px;text-decoration:none;font-weight:600;">Change or cancel</a>
</p>
