<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{subject}}</title>
  </head>
  <!--
    Table layout and inline styles, which is not how anything else in this project is written.
    Email clients are not browsers: Outlook renders through Word, Gmail strips <style> blocks, and
    flexbox is unavailable in most of them. This markup is deliberately twenty years old.
  -->
  <body style="margin:0;padding:0;background:#f4f4f5;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;">
      <tr>
        <td align="center" style="padding:24px 12px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                 style="max-width:560px;background:#ffffff;border-radius:8px;
                        font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
                        color:#18181b;">
            <tr>
              <td style="padding:24px 28px 8px 28px;font-size:18px;font-weight:600;">
                {{businessName}}
              </td>
            </tr>
            <tr>
              <td style="padding:0 28px 24px 28px;font-size:15px;line-height:1.55;">
                {{content}}
              </td>
            </tr>
            <tr>
              <td style="padding:16px 28px 24px 28px;border-top:1px solid #e4e4e7;
                         font-size:12px;line-height:1.5;color:#71717a;">
                {{#businessPhone}}Questions? Call us on {{businessPhone}}.<br />{{/businessPhone}}
                This message was sent by {{businessName}} about your appointment.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
