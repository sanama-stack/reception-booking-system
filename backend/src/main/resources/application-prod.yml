# No seed data, secure cookies, external SMTP. The application refuses to start while JWT_SECRET,
# MANAGE_LINK_SECRET or DB_PASSWORD still holds its local default (docs/06-security.md §9, and
# SecretsGuard for why MAIL_PASSWORD and OPENAI_API_KEY are deliberately not among them).
spring:
  flyway:
    clean-disabled: true
  jpa:
    properties:
      hibernate:
        format_sql: false

app:
  security:
    cookies:
      secure: true

logging:
  level:
    root: INFO
    dev.reception: INFO
