# Values that differ by environment come from an environment variable with a local default.
# The authoritative list of variables is .env.example.

spring:
  application:
    name: reception

  profiles:
    # Running from an IDE sets nothing, and "default" would silently mean production-ish
    # settings against a database that is not there. Development is the default; compose and
    # CI set SPRING_PROFILES_ACTIVE explicitly.
    default: local

  # Caddy routes /api/* to this service without stripping the prefix, so the backend owns
  # the whole /api path (infra/caddy/Caddyfile).
  main:
    banner-mode: off

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:9085}/${DB_NAME:reception}
    username: ${DB_USER:reception}
    password: ${DB_PASSWORD:local-dev-only-postgres-password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      pool-name: reception-pool

  jpa:
    open-in-view: false
    hibernate:
      # The schema comes from Flyway, never from entities (docs/03-data-model.md).
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    validate-on-migrate: true
    clean-disabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:9084}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  threads:
    virtual:
      enabled: true

  web:
    resources:
      # The backend serves no static content — the frontend does. Without this, an unmatched
      # /api path is answered by the resource handler instead of the exception handler.
      add-mappings: false

server:
  port: ${SERVER_PORT:9081}
  servlet:
    context-path: /api
  forward-headers-strategy: framework
  # Caddy is the only thing that talks to this application, and it sets X-Forwarded-For. Without
  # this, every request would appear to come from Caddy and the per-IP rate limits would collapse
  # into one global bucket shared by every visitor — a limit that locks out real users while
  # stopping nobody. The trust is safe precisely because the proxy is the only ingress; exposing
  # the backend's own port to anything but a developer's machine would invalidate it.
  error:
    # Every error body comes from GlobalExceptionHandler; the servlet container writes none.
    whitelabel:
      enabled: false
  shutdown: graceful

springdoc:
  api-docs:
    path: /openapi
  swagger-ui:
    path: /docs
    disable-swagger-default-url: true

management:
  endpoints:
    web:
      exposure:
        # Actuator is not exposed through the public origin; /api/health is the published endpoint.
        include: ""
  endpoint:
    health:
      enabled: false

app:
  public-url: ${APP_PUBLIC_URL:http://localhost:9080}
  rate-limit:
    # The per-endpoint limits themselves are code, in RateLimitProperties, because they are policy
    # rather than configuration (docs/06-security.md §5).
    enabled: ${RATE_LIMIT_ENABLED:true}
  mail:
    from: ${MAIL_FROM:no-reply@reception.local}
  security:
    jwt-secret: ${JWT_SECRET:local-dev-only-jwt-secret-change-me-please}
    manage-link-secret: ${MANAGE_LINK_SECRET:local-dev-only-manage-link-secret-change-me}
  ai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    dev.reception: ${LOG_LEVEL:INFO}
