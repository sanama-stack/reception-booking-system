name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Its own job, and a fast one: it needs a checkout and Python, no containers and no build. It runs
  # beside the others rather than gating them, because a renumbered section should not hold up a
  # test suite — but it is a required check, because the alternative is the state phase 11 found
  # twice, where a document described a control that no file implemented.
  docs:
    name: Documentation consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Links, section references, ADR and migration inventories
        run: python3 docs/tools/consistency/check.py

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Integration tests run against real PostgreSQL and Mailpit in Testcontainers, which the
      # runner's Docker daemon provides. @Tag("llm") tests are excluded by the build script.
      - name: Build and test
        working-directory: backend
        run: ./gradlew build --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/build/reports/jacoco/test
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `version` rather than the `packageManager` field, because this action runs at the
      # repository root and there is no package.json there — frontend/package.json pins the same
      # 11.10.0, and the two must be changed together. Note pnpm/action-setup is being superseded
      # by pnpm/setup; migrating is a separate change from getting off Node 20.
      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck

      - name: Format check
        working-directory: frontend
        run: pnpm format:check

      # Vitest + Testing Library, thin and targeted (docs/phases/phase-11-...md, *The frontend test
      # runner*). It runs at TZ=Asia/Tbilisi, set in vitest.config.mts rather than here, so the
      # business-timezone tests mean the same thing on a laptop as they do on this runner.
      - name: Unit tests
        working-directory: frontend
        run: pnpm test

      - name: Build
        working-directory: frontend
        run: pnpm build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      # Its own compose project, its own database volume, its own ports — and the fake AI provider
      # in place of OpenAI (ADR-0011), which is what makes the Receptionist leg deterministic and
      # free. The application images are the ones the Compose smoke job and the deploy path build.
      - name: Bring the E2E topology up
        run: make up-e2e

      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml

      - name: Install
        working-directory: e2e
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: e2e
        run: pnpm typecheck

      - name: Install Chromium
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: The flow
        working-directory: e2e
        run: pnpm test

      # The trace is the only way to read a failure that happened inside a browser on a runner.
      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      - name: Container logs on failure
        if: failure()
        run: make logs-e2e

      - name: Tear down
        if: always()
        run: make down-e2e

  compose:
    name: Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      # `make up-all` is the deployment topology: everything in containers. Day-to-day
      # development runs the two applications from an IDE against `make up`, but it is this
      # shape that must keep working, so it is this shape CI proves.
      - name: Bring the system up
        run: make up-all

      - name: Both apps answer on the single origin
        run: |
          set -euo pipefail
          # The origin comes from .env (written by `make up-all`), so changing a port in one
          # place cannot leave this check asserting against the old one.
          APP_PORT=$(grep -E '^APP_PORT=' .env | cut -d= -f2)
          ORIGIN="http://localhost:${APP_PORT}"
          echo "Asserting against ${ORIGIN}"
          for _ in $(seq 1 60); do
            if curl -fsS "${ORIGIN}/api/health" > /dev/null; then break; fi
            sleep 5
          done
          echo "--- /api/health ---"
          curl -fsS "${ORIGIN}/api/health" | tee /tmp/health.json
          grep -q '"status":"UP"' /tmp/health.json
          echo "--- / ---"
          curl -fsS -o /dev/null -w '%{http_code}\n' "${ORIGIN}/" | grep -q 200

      # Against the running origin, not against the Caddyfile. A test written from the
      # implementation would have gone green for ten phases while docs/06-security.md §13
      # described a CSP and an HSTS header that no file set (T42) — and this is the only topology
      # whose Content-Security-Policy is the one that ships: `make up` deliberately relaxes
      # script-src for `next dev`, and docker-compose.apps.yml empties that again.
      - name: Security headers
        run: make check-headers

      # docs/06-security.md §12, against the merged compose configuration. It needs no containers
      # and `make up-all` already depends on it, so this step is a second place it runs rather than
      # its only one — but the job that proves the deployment topology is where a reader looks for
      # it. G26: the claim it checks went ten phases described and unimplemented.
      - name: Published bindings
        run: make check-bindings

      # The E2E's model double (ADR-0011), checked on its own before anything is built on it.
      # It needs no containers, and it runs here rather than in the Frontend job because the
      # fake provider is compose infrastructure rather than application code. Its own README
      # records that the transcript-reading property has been shown to fail when the policy is
      # replaced by a turn counter.
      - name: The fake AI provider answers from the transcript
        run: make check-fake-provider

      - name: Container logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.apps.yml logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.apps.yml down -v
