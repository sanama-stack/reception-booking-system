# Infrastructure only. The backend and frontend run on your machine, from your IDE.
#
# Caddy stays in here on purpose: it is what puts both applications on ONE origin
# (http://localhost:8080), which is what lets authentication use httpOnly cookies with no CORS
# anywhere in the system (ADR-0001, docs/06-security.md §2, §13). Running the apps on their own
# ports instead would put them on different origins and break cookie auth from phase 02 onward.
#
# To run the applications in containers too — the deployment topology of
# docs/02-product-architecture.md §1 — use `make up-all`, which layers docker-compose.apps.yml
# on top of this file.

name: reception

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reception}
      POSTGRES_USER: ${POSTGRES_USER:-reception}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    ports:
      # LOOPBACK, and the prefix is the whole point of the line.
      #
      # Published at all only so the backend running in your IDE can reach it — which is this
      # topology and no other: docker-compose.apps.yml removes this mapping outright, because a
      # backend in a container reaches postgres at `postgres:5432` and nothing on the host needs
      # the database. That is docs/06-security.md §12 being true rather than described.
      #
      # Bound to 127.0.0.1 because "0.0.0.0" is what Docker assumes when no host is given, and
      # A HOST FIREWALL DOES NOT COVER IT: Docker writes its own rules in the DOCKER-USER chain,
      # which is consulted below ufw. An unqualified mapping on a public host publishes the
      # database to the internet while `ufw status` still reads as though it does not.
      - "127.0.0.1:${POSTGRES_PORT:-9085}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reception} -d ${POSTGRES_DB:-reception}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.21
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      # Loopback, for the reason postgres carries above — and it matters more here, not less. The
      # UI holds every email this system has ever sent, in full, with no authentication in front
      # of it.
      #
      # SMTP is removed again by docker-compose.apps.yml: only a backend on the host sends through
      # this port. The UI is kept in every topology, because a developer reads it and the E2E flow
      # asserts against it (e2e/tests/support.ts).
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-9084}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-9083}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  caddy:
    image: caddy:2.8-alpine
    environment:
      # Defaults point at the host, where the IDE runs the two applications.
      # docker-compose.apps.yml overrides these with the container names.
      BACKEND_UPSTREAM: host.docker.internal:${SERVER_PORT:-9081}
      FRONTEND_UPSTREAM: host.docker.internal:${FRONTEND_PORT:-9082}
      # The two security headers that differ by environment (docs/06-security.md §13). This is the
      # development topology, where the frontend is `next dev` on the host and compiles modules
      # through eval — so CSP_SCRIPT_EXTRA is 'unsafe-eval' in .env.example, and
      # docker-compose.apps.yml empties it again for the containerised topology that actually ships.
      CSP_SCRIPT_EXTRA: ${CSP_SCRIPT_EXTRA:-}
      HSTS: ${HSTS:-max-age=0}
    extra_hosts:
      # Docker Desktop defines host.docker.internal already; Linux does not.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      # NOT loopback, and deliberately unlike the two above: this is the origin. Every browser
      # that reaches this system arrives here, and on a deployed host that has to include browsers
      # that are not on the host.
      - "${APP_PORT:-9080}:8080"

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
